# Ship whatever is on main, in the one order that is safe.
#
# This exists because the gap between "merged" and "live" was invisible. Five
# pull requests sat merged while production served a build from before the
# first of them, and nothing anywhere said so. A merge that does not reach
# users is not finished, so finishing it is a job rather than a habit.
#
# The order is the whole point:
#
#   1. migrate   the schema the new bundle expects
#   2. deploy    the bundle
#   3. verify    that what is now live actually works
#
# Never the other way round. The frontend selects columns that migrations add
# — ship it first and the orders list breaks for everyone until the migration
# lands. Only migrations not yet recorded in supabase_migrations.schema_migrations
# run. Each one says "Safe to re-run" and is, on its own schema — but not on a
# later one: 0004 defines trading_costs() with a return type a later migration
# changed, and replaying it fails. The first version of this file replayed
# everything and found that out on its first real run.
#
# It runs only after Tests has gone green on main, so a red build never
# deploys.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN          a Vercel access token
#   SUPABASE_ACCESS_TOKEN a Supabase personal access token, for migrations
#   SUPABASE_URL          https://<ref>.supabase.co
#   SUPABASE_ANON_KEY     the publishable key (also public in the bundle)
#
# Required variables (same page, Variables tab):
#   VERCEL_ORG_ID         from .vercel/project.json
#   VERCEL_PROJECT_ID     from .vercel/project.json
#
# If any of these are missing the job FAILS rather than skipping. A workflow
# that reports success while doing nothing is how the Gann refresh went two
# days without running, and a red mark is the only honest way to say "this
# did not ship".

name: Deploy

on:
  workflow_run:
    workflows: ['Tests']
    types: [completed]
    branches: [main]
  # For deploying by hand: a rollback, or the first run after adding secrets.
  workflow_dispatch:

# One at a time. Two deploys racing would have the later migration run against
# the earlier bundle.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ship:
    # A dispatch has no triggering run to inspect; a workflow_run must be green.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which is
          # what we want, but be explicit: this deploys main, not a PR head.
          ref: main

      - name: Check what is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for name in VERCEL_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_URL \
                      SUPABASE_ANON_KEY VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            # An `if` rather than `[ ... ] && ...`: the short form returns
            # non-zero when the variable *is* set, and steps run under `bash
            # -e`, so a fully configured repository would fail right here.
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "## Nothing was deployed"
              echo
              echo "These are not set, so this build is still not live:"
              for name in $missing; do echo "- \`$name\`"; done
              echo
              echo "Add them under Settings → Secrets and variables → Actions."
              echo "\`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\` go in the"
              echo "**Variables** tab; the rest are secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Missing:$missing" >&2
            exit 1
          fi

      # ---------------------------------------------------------------------
      # 1. The schema, first
      # ---------------------------------------------------------------------
      # Through the Management API: HTTPS with a bearer token. A direct
      # Postgres connection from a runner failed four different ways — the
      # direct host is IPv6-only, the pooler wants its own user format, and a
      # password has to survive URL encoding and match the one the dashboard
      # last saved. The API has none of that, and it is how every migration
      # in this project had been applied by hand.
      #
      # Only migrations not yet recorded run. Replaying all of them on every
      # deploy was the first design, and it cannot work: migrations are
      # history, not state — 0004 creates trading_costs() with a return type
      # a later one changed, and Postgres will not change it back.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re, sys, urllib.error, urllib.request

          API = os.environ.get("SUPABASE_API_URL", "https://api.supabase.com")
          MIGRATIONS = os.environ.get("MIGRATIONS_DIR", "supabase/migrations")

          # Applied by hand, through this same API, before this workflow could reach
          # the database — so the live project is at this version with nothing recorded.
          # 0011 created public.trailing_stop_level; finding it, with no migration of
          # ours recorded, is what identifies that state. Only ever used once: after
          # the first run every version is recorded and this plays no part.
          BASELINE = "0011"

          token = os.environ["SUPABASE_ACCESS_TOKEN"].strip()
          match = re.match(r"https://([a-z0-9]+)\.supabase\.co", os.environ.get("SUPABASE_URL", ""))
          if not match:
              print("PROBLEM: SUPABASE_URL is not https://<project-ref>.supabase.co, "
                    "so the project to migrate cannot be worked out from it.")
              sys.exit(1)
          ref = match.group(1)


          def query(sql, label):
              request = urllib.request.Request(
                  f"{API}/v1/projects/{ref}/database/query",
                  data=json.dumps({"query": sql}).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      # The API sits behind a bot filter that turns away urllib's
                      # default user agent with an HTML page instead of an answer.
                      "User-Agent": "invest-pal-deploy",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      body = response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  try:
                      detail = json.loads(body).get("message", body)
                  except ValueError:
                      detail = body
                  hint = {
                      401: "the token is not valid: revoked, expired, or pasted incompletely",
                      403: "the token belongs to an account that cannot manage this project",
                      404: f"no project '{ref}' is visible to this token",
                  }.get(error.code, "the database rejected it")
                  print(f"--- {label}: HTTP {error.code}, {hint}")
                  print(str(detail)[:2000])
                  sys.exit(1)
              try:
                  return json.loads(body) if body.strip() else []
              except ValueError:
                  return []


          def literal(text):
              return "'" + text.replace("'", "''") + "'"


          migrations = []
          for path in sorted(glob.glob(f"{MIGRATIONS}/*.sql")):
              version, _, name = os.path.basename(path)[:-4].partition("_")
              migrations.append((version, name, path))

          # The table the Supabase CLI keeps, so the dashboard and the CLI agree with
          # this workflow about what has been applied.
          query(
              "create schema if not exists supabase_migrations;"
              " create table if not exists supabase_migrations.schema_migrations"
              " (version text primary key);"
              " alter table supabase_migrations.schema_migrations"
              " add column if not exists name text;",
              "migration history",
          )
          recorded = {row["version"] for row in
                      query("select version from supabase_migrations.schema_migrations;",
                            "migration history")}

          ours = {version for version, _, _ in migrations}
          if not recorded & ours:
              state = query(
                  "select"
                  " to_regclass('public.profiles') is not null as has_schema,"
                  " exists (select 1 from pg_proc p"
                  "   join pg_namespace n on n.oid = p.pronamespace"
                  "   where n.nspname = 'public' and p.proname = 'trailing_stop_level')"
                  " as at_baseline;",
                  "database state",
              )[0]
              if state["at_baseline"]:
                  known = [(v, n) for v, n, _ in migrations if v <= BASELINE]
                  query(
                      "insert into supabase_migrations.schema_migrations (version, name) values "
                      + ", ".join(f"({literal(v)}, {literal(n)})" for v, n in known)
                      + " on conflict (version) do nothing;",
                      "baseline",
                  )
                  recorded |= {v for v, _ in known}
                  print(f"Recorded {len(known)} migrations up to {BASELINE} as already applied: "
                        "the database was migrated by hand before this history existed.")
              elif state["has_schema"]:
                  print("PROBLEM: the database has tables but no record of which migrations "
                        "made them, and it is not at the known hand-applied version "
                        f"({BASELINE}). Replaying from 0001 would fail or undo later changes, "
                        "so nothing was run. Record the applied versions in "
                        "supabase_migrations.schema_migrations, then deploy again.")
                  sys.exit(1)

          pending = [(v, n, p) for v, n, p in migrations if v not in recorded]
          for version, name, path in pending:
              # One request, one transaction: the migration and the record of it
              # commit together or not at all, so a failure leaves nothing half-done
              # and nothing wrongly marked as applied.
              query(
                  "begin;\n"
                  + open(path, encoding="utf-8").read()
                  + "\n;\ninsert into supabase_migrations.schema_migrations (version, name)"
                  f" values ({literal(version)}, {literal(name)})"
                  " on conflict (version) do nothing;\ncommit;",
                  os.path.basename(path),
              )
              print(f"--- {os.path.basename(path)}: applied")

          if pending:
              print(f"Applied {len(pending)} new migration(s); "
                    f"{len(migrations) - len(pending)} were already in place.")
          else:
              print(f"Nothing to apply: all {len(migrations)} migrations are already in place.")
          PY
          # No pipe into tee or the like: under bash -e without pipefail, a
          # failed migration would exit 0 through the pipe and the deploy
          # would go ahead over a broken schema.

      # ---------------------------------------------------------------------
      # 2. The bundle
      # ---------------------------------------------------------------------
      - name: Deploy to production
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Read by the CLI from the environment, so it never appears in a
          # command line or a process listing.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Built on Vercel rather than here, so the build picks up the
          # environment variables configured in the dashboard. A local build
          # would bake in whatever this runner happened to have, which is how
          # a localhost Supabase URL once reached production.
          url=$(npx --yes vercel@latest deploy --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 3. Proof that it works, against the thing that is now live
      # ---------------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sanity checks against production
        env:
          # The project's own domain, not the per-deployment URL: an alias that
          # has not switched over yet would have us checking the old build.
          BASE_URL: https://invest-pal.vercel.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sanity.mjs
