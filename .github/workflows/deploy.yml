# Ship whatever is on main, in the one order that is safe.
#
# This exists because the gap between "merged" and "live" was invisible. Five
# pull requests sat merged while production served a build from before the
# first of them, and nothing anywhere said so. A merge that does not reach
# users is not finished, so finishing it is a job rather than a habit.
#
# The order is the whole point:
#
#   1. migrate   the schema the new bundle expects
#   2. deploy    the bundle
#   3. verify    that what is now live actually works
#
# Never the other way round. The frontend selects columns that migrations add
# — ship it first and the orders list breaks for everyone until the migration
# lands. Migrations are additive and idempotent ("Safe to re-run" at the top of
# every one), so re-applying all of them each time needs no bookkeeping and
# costs a few seconds.
#
# It runs only after Tests has gone green on main, so a red build never
# deploys.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN          a Vercel access token
#   SUPABASE_DB_URL       postgresql://... connection string for the project
#   SUPABASE_URL          https://<ref>.supabase.co
#   SUPABASE_ANON_KEY     the publishable key (also public in the bundle)
#
# Required variables (same page, Variables tab):
#   VERCEL_ORG_ID         from .vercel/project.json
#   VERCEL_PROJECT_ID     from .vercel/project.json
#
# If any of these are missing the job FAILS rather than skipping. A workflow
# that reports success while doing nothing is how the Gann refresh went two
# days without running, and a red mark is the only honest way to say "this
# did not ship".

name: Deploy

on:
  workflow_run:
    workflows: ['Tests']
    types: [completed]
    branches: [main]
  # For deploying by hand: a rollback, or the first run after adding secrets.
  workflow_dispatch:

# One at a time. Two deploys racing would have the later migration run against
# the earlier bundle.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ship:
    # A dispatch has no triggering run to inspect; a workflow_run must be green.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which is
          # what we want, but be explicit: this deploys main, not a PR head.
          ref: main

      - name: Check what is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          # Either route to the database will do: the Management API with an
          # access token, or a Postgres URL. Only when neither is set is one
          # of them reported missing.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -z "$SUPABASE_DB_URL" ]; then
            missing="SUPABASE_ACCESS_TOKEN"
          fi
          for name in VERCEL_TOKEN SUPABASE_URL SUPABASE_ANON_KEY \
                      VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            # An `if` rather than `[ ... ] && ...`: the short form returns
            # non-zero when the variable *is* set, and steps run under `bash
            # -e`, so a fully configured repository would fail right here.
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "## Nothing was deployed"
              echo
              echo "These are not set, so this build is still not live:"
              for name in $missing; do echo "- \`$name\`"; done
              echo
              echo "Add them under Settings → Secrets and variables → Actions."
              echo "\`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\` go in the"
              echo "**Variables** tab; the rest are secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Missing:$missing" >&2
            exit 1
          fi

      # Set is not the same as right. "Network is unreachable" and "password
      # authentication failed" both say what psql could not do and nothing
      # about which part of the URL is wrong, so read the URL first and name
      # the part. The password is described by length and character classes
      # only; everything else in a connection string is not secret.
      - name: Check the database URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Migrating through the Management API; the database URL is not used."
            exit 0
          fi
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlsplit, unquote

          raw = os.environ.get("DATABASE_URL", "")
          problems = []

          # Checked before parsing: square brackets mean an IPv6 address to a URL
          # parser, so a password still wrapped in Supabase's [YOUR-PASSWORD] brackets
          # does not fail as a bad password, it fails as a nonsense host.
          credentials = raw.split("://", 1)[-1].rpartition("@")[0]
          if "[" in credentials or "]" in credentials:
              print("PROBLEM: the password still has the [ ] from Supabase's "
                    "[YOUR-PASSWORD] placeholder. Replace the brackets too, not just "
                    "the words inside them.")
              sys.exit(1)

          try:
              u = urlsplit(raw)
              user = unquote(u.username or "")
              password = unquote(u.password or "")
              host = u.hostname or ""
              port = u.port
              db = (u.path or "").lstrip("/")
          except ValueError as e:
              print(f"SUPABASE_DB_URL does not parse as a URL: {e}")
              sys.exit(1)

          if u.scheme not in ("postgres", "postgresql"):
              problems.append(f"it starts with '{u.scheme}://', not 'postgresql://'")
          if host.startswith("db.") and host.endswith(".supabase.co"):
              problems.append("the host is the direct one (db.<ref>.supabase.co), which has no "
                              "IPv4 address; GitHub runners cannot reach it. Use the Session "
                              "pooler host (…pooler.supabase.com)")
          if "pooler.supabase.com" in host and "." not in user:
              problems.append(f"the pooler needs the user 'postgres.<project-ref>', not '{user}'")
          if "pooler.supabase.com" in host and port == 6543:
              problems.append("port 6543 is transaction mode, which cannot run every migration; use 5432")
          if not password:
              problems.append("there is no password in it")
          if "YOUR-PASSWORD" in password.upper() or "YOUR_PASSWORD" in password.upper():
              problems.append("the password is still the placeholder text")
          if password != password.strip():
              problems.append("the password has spaces at its start or end")

          # Everything here is safe to print: user, host, port and database are not
          # secret, and the password is described only by its length and the kinds of
          # character in it — enough to compare against the one you meant, nothing more.
          kinds = []
          if any(c.isalpha() for c in password): kinds.append("letters")
          if any(c.isdigit() for c in password): kinds.append("digits")
          specials = sorted({c for c in password if not c.isalnum()})
          print(f"user     {user}")
          print(f"host     {host}")
          print(f"port     {port}")
          print(f"database {db}")
          print(f"password {len(password)} characters: {', '.join(kinds) or 'none'}"
                + (", and symbols" if specials else ", no symbols"))

          if problems:
              print()
              for p in problems:
                  print(f"PROBLEM: {p}")
              sys.exit(1)
          PY

      # ---------------------------------------------------------------------
      # 1. The schema, first
      # ---------------------------------------------------------------------
      # Preferred route: the Management API, over HTTPS with an access token.
      # A direct Postgres connection from a runner has failed four ways — the
      # direct host is IPv6-only, the pooler needs its own user format, and a
      # password has to survive URL encoding and match the one the dashboard
      # last saved. The API has none of those, and it is the route every
      # migration in this project has actually been applied through so far.
      #
      # The Postgres URL still works when no token is set. Either way every
      # file runs every time: they are written to be re-applied, with
      # `if not exists` and `drop ... if exists` guards throughout.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PGSSLMODE: require
          # Through the environment, never pasted into the script: an
          # expression is substituted into the shell text before bash runs,
          # so a password with $ or a backtick in it was being rewritten by
          # the shell — and failed as a wrong password.
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            python3 - <<'PY'
          import glob, json, os, re, sys, urllib.error, urllib.request

          token = os.environ["SUPABASE_ACCESS_TOKEN"].strip()
          match = re.match(r"https://([a-z0-9]+)\.supabase\.co", os.environ.get("SUPABASE_URL", ""))
          if not match:
              print("PROBLEM: SUPABASE_URL is not https://<project-ref>.supabase.co, "
                    "so the project to migrate cannot be worked out from it.")
              sys.exit(1)
          ref = match.group(1)
          endpoint = f"https://api.supabase.com/v1/projects/{ref}/database/query"

          files = sorted(glob.glob("supabase/migrations/*.sql"))
          for path in files:
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({"query": open(path, encoding="utf-8").read()}).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      # The API sits behind a bot filter that turns away urllib's
                      # default user agent with an HTML page instead of an answer.
                      "User-Agent": "invest-pal-deploy",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=180):
                      pass
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  try:
                      detail = json.loads(body).get("message", body)
                  except ValueError:
                      detail = body
                  hint = {
                      401: "the token is not valid: revoked, expired, or pasted incompletely",
                      403: "the token belongs to an account that cannot manage this project",
                      404: f"no project '{ref}' is visible to this token",
                  }.get(error.code, "the database rejected this migration")
                  print(f"--- {path}: HTTP {error.code}, {hint}")
                  print(str(detail)[:2000])
                  sys.exit(1)
              print(f"--- {path}: applied")

          print(f"Applied {len(files)} migrations to {ref} through the Management API.")
          PY
            # No pipe into tee above: under bash -e without pipefail, a failed
            # migration would exit 0 through the pipe and the deploy would go
            # ahead on a broken schema.
            echo "Applied $(ls supabase/migrations/*.sql | wc -l) migrations through the Management API." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            for f in supabase/migrations/*.sql; do
              echo "--- $f"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            done
            echo "Applied $(ls supabase/migrations/*.sql | wc -l) migrations." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------------------------------------------------------------------
      # 2. The bundle
      # ---------------------------------------------------------------------
      - name: Deploy to production
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Read by the CLI from the environment, so it never appears in a
          # command line or a process listing.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Built on Vercel rather than here, so the build picks up the
          # environment variables configured in the dashboard. A local build
          # would bake in whatever this runner happened to have, which is how
          # a localhost Supabase URL once reached production.
          url=$(npx --yes vercel@latest deploy --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 3. Proof that it works, against the thing that is now live
      # ---------------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sanity checks against production
        env:
          # The project's own domain, not the per-deployment URL: an alias that
          # has not switched over yet would have us checking the old build.
          BASE_URL: https://invest-pal.vercel.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sanity.mjs
