# Keeps the gann_signals cache warm.
#
# The engine runs here rather than in a hosted service: the browser only ever
# reads the cached rows from Supabase, so there is nothing to deploy.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL                 your project URL
#   SUPABASE_SERVICE_ROLE_KEY    service role key — bypasses RLS, keep it here
#
# Optionally also:
#   OPENROUTER_API_KEY           enables the AI mentor summaries
#   OPENROUTER_MODEL             override the default model slug
#
# On a fork the job skips quietly when they are absent, so a fresh clone does
# not email anyone about red builds. On this repository it FAILS instead: the
# silent skip meant this job reported success every night for two days while
# never once running the engine, and the Gann data on the site quietly went
# stale. A job that does nothing should not look like a job that worked.
name: Refresh Gann signals

on:
  schedule:
    # 06:20 UTC daily, after the US close and before the next open.
    - cron: '20 6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check credentials
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          IS_UPSTREAM: ${{ github.repository == 'shayh22/invest-pal' }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "## The engine did not run"
            echo
            echo "\`SUPABASE_URL\` is not set, so no signals were refreshed"
            echo "and the cached ones are another day staler."
            echo
            echo "Add \`SUPABASE_URL\` and \`SUPABASE_SERVICE_ROLE_KEY\` under"
            echo "Settings → Secrets and variables → Actions."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IS_UPSTREAM" = "true" ]; then
            echo "SUPABASE_URL is not set; the refresh did nothing." >&2
            exit 1
          fi
          echo "SUPABASE_URL is not set; skipping (fork)."

      - name: Run the engine
        if: steps.creds.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Absent is fine: the run then skips the mentor summaries.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        # The engine has no dependencies, so there is nothing to install.
        run: python -m gann.refresh --ttl-hours 26
